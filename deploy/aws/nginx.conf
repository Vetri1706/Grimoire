user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No cookies, credentials, request bodies or query strings in access logs.
    log_format bounded '$request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout bounded;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 256k;
    client_body_timeout 15s;
    send_timeout 30s;

    # Only the local Caddy listener can supply the client IP used for limits.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_zone $binary_remote_addr zone=auth:1m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:2m rate=20r/s;
    limit_req_status 429;

    server {
        listen 127.0.0.1:8088;
        server_name _;
        root /usr/share/nginx/html;

        # Diagnostics and first-owner creation remain host-local operations.
        location = /api/health { return 404; }
        location = /api/setup/owner { return 404; }

        location ~ ^/api/session/(login|signup|google)$ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }
        location ~ /\. { return 404; }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
