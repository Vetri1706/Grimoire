<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <script>
      // Resolve appearance before the first paint. Store choices, not OS results.
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('grimoire.theme-preference');
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch { /* System appearance works without browser storage. */ }
        const dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#171717' : '#ffffff';
      })();
    </script>
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="Grimoire Scion intake. Record what is known, make missing information visible, and preserve every revision." />
    <title>Grimoire · Scion intake</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
